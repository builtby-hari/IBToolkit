# ILLUSTRATIVE CASE. Made-up companies and round numbers for a mid-cap industrial services target.
# Not real companies, not market data, not a forecast. Money is in $ millions except per-share figures.
# Cost of capital inputs are round-number assumptions, not sourced market rates.

[meta]
name = "Illustrative Industrial Services Target"
illustrative = true

[target]
net_debt = 500
diluted_shares = 100       # millions
ltm_revenue = 1800
ntm_revenue = 1950
ltm_ebitda = 360
ntm_ebitda = 405
ltm_eps = 1.80
ntm_eps = 2.05

[dcf]
revenue_growth = [0.08, 0.07, 0.06, 0.05, 0.04]
ebitda_margin = [0.205, 0.207, 0.209, 0.210, 0.210]
da_pct_revenue = 0.04
capex_pct_revenue = 0.045
nwc_pct_revenue_change = 0.10   # NWC investment as % of the change in revenue
tax_rate = 0.25
risk_free = 0.04
equity_risk_premium = 0.05
beta = 1.10
pre_tax_cost_of_debt = 0.065
debt_to_capital = 0.25          # target capital structure
terminal_growth = 0.025
exit_multiple = 10.5            # x Year 5 EBITDA
mid_year = true

