# ILLUSTRATIVE CASE. Round numbers for a lower middle market services business.
# Not a real company, not a forecast, not market data. Money is in $ thousands.

[meta]
name = "Illustrative Lower Middle Market Services Business"
illustrative = true

[transaction]
ltm_revenue = 60000        # $60.0M
ltm_ebitda = 10000         # $10.0M
entry_multiple = 7.0       # x LTM EBITDA
exit_multiple = 7.0        # x Year 5 EBITDA
advisory_fee_pct = 0.02    # of purchase price
financing_fee_pct = 0.025  # of debt raised plus the revolver commitment
financing_fee_years = 5    # capitalized and amortized straight line; advisory fees are expensed at close
cash_at_close = 0          # minimum cash is not funded at close, so year 1 draws the revolver to hold it;
                           # a sponsor would usually fund it in Uses (set this to min_cash, which adds equity)

[operating]
revenue_growth = [0.06, 0.06, 0.05, 0.05, 0.04]
ebitda_margin = [0.168, 0.170, 0.172, 0.174, 0.175]
da_pct_revenue = 0.03
capex_pct_revenue = 0.025
nwc_pct_revenue_change = 0.10   # NWC investment as % of the change in revenue
tax_rate = 0.25

[senior]                    # Senior term loan
leverage = 3.5              # x LTM EBITDA
rate = 0.09                 # on beginning balance
amort_pct = 0.05            # of original principal per year
sweep_pct = 0.50            # of excess cash flow after mandatory amortization

[mezz]                      # Subordinated notes, half cash and half PIK
leverage = 1.0
cash_rate = 0.06
pik_rate = 0.06

[revolver]                  # Undrawn at close; draws if cash would fall below the minimum
commitment = 5000
rate = 0.085                # on beginning drawn balance
undrawn_fee = 0.005         # on beginning undrawn commitment
min_cash = 3000             # revolver draws below this, repays first from cash above it

[covenants]                 # Tested at each year end; step-downs are illustrative
max_total_leverage = [5.75, 5.50, 5.00, 4.50, 4.00]
min_interest_coverage = [1.75, 1.75, 2.00, 2.00, 2.25]
