# ILLUSTRATIVE CASE. Two made-up regional banks with round numbers.
# Not real companies, not a forecast, not market data. Money is in $ thousands,
# shares are in thousands, share prices are in dollars.

[meta]
name = "Illustrative Regional Bank Merger (Acquirer and Target Are Made Up)"
illustrative = true

[acquirer]
net_income = [200000, 210000]  # Years 1 and 2, standalone
shares = 50000                 # 50.0M shares
share_price = 48.00
tbv = 1200000                  # tangible book value, $1.2B
tangible_assets = 14000000     # for the TCE ratio
ltm_net_income = 190000        # contribution analysis inputs (0 or left out = metric not shown)
total_assets = 14300000
deposits = 11500000
loans = 10000000

[target]
net_income = [30000, 32000]
shares = 10000
share_price = 30.00
tbv = 250000
tangible_assets = 3000000
noninterest_expense = 70000
core_deposits = 2000000
loans = 2000000
securities = 600000
ltm_net_income = 28000
total_assets = 3050000
deposits = 2500000

[deal]
p_tbv = 1.5               # offer as a multiple of target TBV (or use price_per_share)
stock_pct = 0.60          # rest is cash
cost_of_cash = 0.045      # pre-tax funding cost or foregone yield on cash paid
cost_saves_pct = 0.30     # of target noninterest expense
phase_in = [0.50, 1.00]   # share of saves realized in Years 1 and 2
merger_charges = 30000    # one-time, pre-tax
cdi_pct = 0.015           # of target core deposits
cdi_years = 10
tax_rate = 0.25

[marks]                     # rate mark = -duration x rate change x balance
loan_duration = 3.5
loan_rate_change = 0.005    # market yield above book yield
loan_life = 5               # years the mark accretes back
securities_duration = 4.0
securities_rate_change = 0.005
securities_life = 5
